# 80으로 들어오는 요청은 도메인·IP 구분 없이 전부 https로 리다이렉트한다.
# 인증서가 도메인 전용이라 리다이렉트 대상도 $host가 아니라 도메인을 고정으로 쓴다
# (IP로 직접 접속한 요청을 https://<IP>로 보내면 인증서 불일치 경고가 뜬다).
# mememory-cra.duckdns.org는 신규 브랜드 도메인, mimori-cra.duckdns.org는 기존 링크/북마크
# 호환을 위해 당분간 함께 유지 — 새 이름으로 리다이렉트한다.
server {
    listen 80 default_server;
    server_name mimori-cra.duckdns.org mememory-cra.duckdns.org _;
    return 301 https://mememory-cra.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name mimori-cra.duckdns.org mememory-cra.duckdns.org;

    # 인증서는 EC2 호스트의 certbot(Let's Encrypt)이 발급·갱신하고, docker-compose.yml이
    # /etc/letsencrypt를 이 컨테이너에 read-only로 그대로 마운트한다.
    # 인증서 lineage 이름은 최초 발급 시 도메인(mimori-cra.duckdns.org)을 그대로 쓴다 —
    # `certbot --expand -d mimori-cra.duckdns.org -d mememory-cra.duckdns.org`로 같은
    # lineage에 새 도메인만 추가하면 경로를 바꿀 필요가 없다.
    ssl_certificate /etc/letsencrypt/live/mimori-cra.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimori-cra.duckdns.org/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
}

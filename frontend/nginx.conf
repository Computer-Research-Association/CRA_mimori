# mimori-cra.duckdns.org로 들어오면 https로 리다이렉트. IP로 직접 접속하는 경우(도메인
# 인증서가 커버 못 함)는 건드리지 않고 기존처럼 http로 그냥 서빙한다(아래 default_server).
server {
    listen 80;
    server_name mimori-cra.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # gunicorn --timeout 600(docker-compose.yml의 api 서비스)과 맞춤 —
        # 안 맞추면 nginx가 느린 analyze/rag 응답을 gunicorn보다 먼저 끊어버림
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name mimori-cra.duckdns.org;

    # 인증서는 EC2 호스트의 certbot(Let's Encrypt)이 발급·갱신하고, docker-compose.yml이
    # /etc/letsencrypt를 이 컨테이너에 read-only로 그대로 마운트한다.
    ssl_certificate /etc/letsencrypt/live/mimori-cra.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimori-cra.duckdns.org/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
}

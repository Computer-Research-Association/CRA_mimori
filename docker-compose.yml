services:
  scheduler:
    build: .
    container_name: mimori-scheduler
    depends_on:
      - mongo
      - qdrant
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped

  api:
    build: .
    container_name: mimori-api
    # gunicorn --timeout은 실용적 타협치일 뿐 하드 개런티가 아님: analyze()의 내부 재시도/타임아웃
    # 예산(최대 100분/시도 x 최대 3회)이 훨씬 더 크기 때문. -w 1(워커 1개)이라 타임아웃으로 워커가
    # 죽으면 그 순간 처리 중이던 다른 모든 요청도 함께 죽는다(전체 다운타임 + BGE-M3 재로드 발생).
    command: uv run --no-dev gunicorn -w 1 --threads 4 --timeout 600 -b 0.0.0.0:5000 api.app:app
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - qdrant
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mimori-mongo
    ports:
      # 반드시 127.0.0.1로 묶어둘 것. "27017:27017"로 쓰면 0.0.0.0에 열려 인스턴스의
      # 모든 인터페이스에서 접근 가능해진다 — 2026-08-04에 이 상태로 노출됐다가
      # 랜섬 공격을 받았다. 방화벽/보안 그룹은 실수로 열리기 쉬우니 여기서도 막는다.
      # 컨테이너끼리는 도커 네트워크(mongo:27017)로 통신하므로 영향 없고,
      # 호스트에서 mongosh로 붙는 것과 SSH 터널(LocalForward)도 그대로 동작한다.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: mimori-qdrant
    ports:
      # 호스트의 6333은 Windows가 예약한 포트 범위(6239-6338)라 16333으로 노출.
      # mongo와 같은 이유로 127.0.0.1에 묶는다(외부 노출 금지).
      - "127.0.0.1:16333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: mimori-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # mimori-cra.duckdns.org 인증서. 호스트의 certbot이 발급·갱신(renewal-hook이
      # 갱신 후 이 컨테이너에 nginx -s reload)하고, 컨테이너는 읽기 전용으로 마운트.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

  # 미리보기 전용 — 별도 git worktree(../CRA_mimori-preview)에서 원하는 브랜치를
  # 체크아웃해 빌드한다. web(80, 안정판)은 건드리지 않고 8080에서 신규 버전만 확인.
  # 셋업: git worktree add ../CRA_mimori-preview dev  (레포 루트에서 최초 1회)
  # 갱신: git -C ../CRA_mimori-preview pull && docker compose build web-preview && docker compose up -d web-preview
  web-preview:
    build:
      context: ../CRA_mimori-preview/frontend
    container_name: mimori-web-preview
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
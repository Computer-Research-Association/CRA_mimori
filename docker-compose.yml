services:
  flask:
    build: .
    container_name: mimori-flask
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - qdrant
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mimori-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: mimori-qdrant
    ports:
      - "16333:6333"  # 호스트의 6333은 Windows가 예약한 포트 범위(6239-6338)라 16333으로 노출
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  mongo_data:
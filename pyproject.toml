[project]
name = "mimori"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "apscheduler>=3.11.3",
    "boto3>=1.38.0",
    "watchtower>=3.3.1",
    # base.py가 Accept-Encoding에 br을 보내므로 brotli 디코더가 반드시 필요
    "beautifulsoup4>=4.15.0",
    "brotli>=1.1.0",
    "flagembedding>=1.4.0",
    "flask>=3.1.3",
    "flask-cors>=5.0.0",
    "google-api-python-client>=2.198.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "pytrends>=4.9.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "tavily-python>=0.7.26",
    "torch",
    "transformers>=5.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

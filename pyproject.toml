[project]
name = "mimori"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "flagembedding>=1.4.0",
    "flask>=3.1.3",
    "google-api-python-client>=2.198.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pymongo>=4.17.0",
    "qdrant-client>=1.18.0",
    "tavily-python>=0.7.26",
    "torch",
    "transformers>=5.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
